[project]
name = "amplifier-module-tool-work-tracker"
version = "0.1.0"
description = "Amplifier tool module: atomic claim, PID-bound custody, fenced resolve, and discovered-work filing for amplifier-work-tracker."
requires-python = ">=3.11"
# Empty deliberately. `amplifier_work_tracker` is not a PyPI dependency of this
# module -- this repo's root pyproject.toml makes amplifier-work-tracker itself
# an installable bundle-root package (see docs/BUNDLE_GUIDE.md, "Bundle with
# Root Python Package"). Foundation's activate_bundle_package() installs that
# root package editable and puts its src/ on sys.path before any module
# mounts, which is what makes `from amplifier_work_tracker import adapter`
# below resolve. Declaring it here too would have uv try to resolve it from
# an index at module-install time and fail, since it isn't published.
# amplifier-core is a peer dependency and is never declared here either.
dependencies = []

[project.entry-points."amplifier.modules"]
tool-work-tracker = "amplifier_module_tool_work_tracker:mount"

# amplifier-core IS published (PyPI), so it's safe here as a type-checking /
# local-test dependency -- this group is never installed by foundation's
# runtime module activation, only by a developer running `pip install -e
# .[dev]` inside this module directory.
[project.optional-dependencies]
dev = [
    "amplifier-core",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_work_tracker"]

[tool.pyright]
# amplifier_work_tracker resolves via the repo's own src/ (root package this
# module is co-located with); amplifier_core resolves via the dev dependency
# above once installed. Neither is a runtime dependency of this module.
extraPaths = ["../../src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
