    the same injection measured 5.36:1 in light -- above the floor (OSV1-030
    carried that as a VIOLATION pin until the rebuild).

    What it injects now, and what this row's probe re-reads: a LITERAL
    below-floor pair, `#9aa3b2` on `#eef2fb`, measured at 2.27:1 in BOTH
