- id: CCV1-015
  title: every item-level write verb verifies a conflicted write
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 11
    quote: |
      If a write is reported as failed (exception raised, error returned), the item state must
      not have changed as if the write succeeded.
  disposition: CONFORMS
  work: work_item_pipeline-2x3
  assertion:
    kind: probe
    ref: test_row_ccv1_015
  notes: >
    FIXED. One shared helper, `Beads._verified_write`, now carries the
    discipline for every item-level write verb: on a conflict-family
    failure (the wrapper's exhausted-retry raise, or a non-zero exit whose
    output names a serialization/connection failure) it decides the real
    outcome by a contention-free read-back instead of trusting the
    wrapper, and on a reported SUCCESS it verifies anyway. A genuine
    domain refusal is never verified away, and a write that truly did not
    land still raises. Routed: create, update, comment, edit_item (both
    halves), supersede, claim_item, claim_next, release, reopen (added
    2026-09-02 merging origin/main's PR #67 -- item model_performance-f5c),
    defer/undefer, block/unblock, add_dependency, take_custody,
    renew_custody (the write behind the tool's `declare`). `resolve` keeps
    its own PR #63 shape verbatim -- the region is pinned by CCV1-009 and
    owned by another change; the behaviour is identical. `move_item` is
    deliberately NOT routed: it never touches bd or `Beads._run` (direct
    dolt SQL), so the retry hazard cannot reach it, and it already verifies
    by real row counts in dst plus a residue check in src, with a
    compensating cleanup on failure. Measured 2026-09-02 in
    tests/integration/test_write_readback.py -- a conflict-after-landed
    case per verb (including reopen's own, added with the merge), phantom-
    success negatives for release/claim x2/create/comment/defer/dep/
    renew_custody, genuine-failure negatives for claim x2/create, and ::
    test_move_refuses_when_the_copy_reports_success_but_the_rows_are_not_there
