    HONEST LIMIT of the block census, the same one the inline census carries:
    `classify_style` skips a size declaration whose value mentions `var(`, so
    `border:1px solid var(--rule-hi)` is NOT counted as literal. That
    under-counts rather than over-counts, which is the safe direction for a
    pin; the rule is shared between both halves ON PURPOSE, so one cannot
