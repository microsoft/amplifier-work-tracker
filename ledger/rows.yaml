    rather than re-derived from the kit's real results. All five GAP rows are
    GAP precisely because they ARE assertable and simply are not asserted yet.

- id: OSV1-032
  title: >-
    Freeze 6 -- 66 literal inline sites and 40 <style>-block declarations
    remain, so the register is not complete
  contract:
    file: contracts/operator-surface.v1.md
    clause: Freeze 6
    quote: |
      **Freeze 6:** the exemption register named in Core 4 is complete in `ledger/` — every
      computed-geometry inline-style site enumerated, and no literal colour, font, or size site
      remaining.
  disposition: GAP
  work: work_item_pipeline-np3
  assertion:
    kind: probe
    ref: test_row_osv1_032
  notes: >
    PINNING ROW -- the probe pins that literal sites still remain; a passing
    probe here is NOT conformance. Flip direction VIOLATION-MOVEMENT.

    TWO CONJUNCTS, MEASURED SEPARATELY 2026-09-04 against 4aaee50:
      "every computed-geometry inline-style site enumerated"  -- ALREADY TRUE.
      OSV1-006 enumerates all 23 and asserts the set is exact on every run.
      "no literal colour, font, or size site remaining"       -- FALSE. 66
      remain (OSV1-005).
    So this condition fails on its second half only, and it closes exactly when
    OSV1-005 does. It is rowed separately rather than folded into OSV1-005
    because it is the Freeze Bar's own gate: the register being COMPLETE is a
    stronger statement than the census being CURRENT, and a future reader
    stamping FROZEN reads this row, not the census row.

    RE-READ 2026-09-04 against the DRAFT true-up #1. Freeze 6's own text is
    UNCHANGED by the true-up and this row's quote still verifies byte-for-byte
    -- but the word "site" in its second half reads through Core 4, and Core 4
    was widened. So what this gate now requires is zero literal sites in BOTH
    senses: inline `style=` attributes (66 remain) AND declarations in a
    `<style>` block outside the token module (40 remain, all in
    webtrust.py:256-302). The probe was extended to pin both halves
    SEPARATELY, because the failure mode this row exists to prevent is exactly
    the plausible one: migrating all 66 inline sites, seeing a green inline
    census, and stamping a Freeze gate while a whole page-local stylesheet
    still hardcodes the retired palette. Disposition unchanged (GAP); the same
    work item (work_item_pipeline-np3) closes both halves.

- id: OSV1-033
  title: Freeze 7 -- every quotation citing an in-repo file verifies against it
  contract:
    file: contracts/operator-surface.v1.md
    clause: Freeze 7
    quote: |
      **Freeze 7:** every quote in this contract is verified as a contiguous, whitespace-collapsed
      substring of the file it cites.
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: test_row_osv1_033
  notes: >
    FLIPPED GAP -> CONFORMS 2026-09-04, direction VIOLATION-MOVEMENT, and the
    probe RETARGETED in the same change. This row is the worked example of the
    flip direction this repo defines locally (reconcile-report.md sec.11.1):
    the seed probe PINNED a failing quote; the owner-ratified DRAFT true-up #1
    ("yep, do it all.") corrected it; the pin went red; the row moved and the
    pin was replaced by a real check. A passing pin would not have been
    conformance -- only the retargeted probe is.

    WHAT WAS WRONG AT SEED, and is now fixed. The Changelog carried two quotes
    attributed to `webapp.py:37-44`. Under the matching semantics
    LEDGER-FORMAT.md sec.2 defines -- collapse whitespace runs on both sides,
    then require a substring, with words, markdown markup and character order
    EXACT -- one verified and one did not:
      WAS FAILING  "the dashboard's hero is the AGE of the oldest unclaimed
                   item, **never a count**" -- webapp.py:38-39 reads
                   "...unclaimed item, never a count." with NO markdown
                   emphasis. The contract had added the `**` pair; markup is
                   part of the exact match.
      WAS PASSING  "a giant `0` trains a viewer to stop looking. An age reads
                   as neglect" -- verbatim against webapp.py:39-40, backticks
                   included.
    The true-up struck the `**` pair and nothing else: the quoted span is now
    byte-exact, and it is still a quotation (the surrounding `*"..."*` markers
    are the contract's own attribution convention and sit OUTSIDE the span).
    The source was not touched -- fixing a quote by editing the prose it cites
    is the wrong end, and the probe now asserts webapp.py did not acquire the
    emphasised form either.

    WHAT THE RETARGETED PROBE ASSERTS, on every run:
      1. every `*"..."*` attributed quotation anywhere in the contract either
         verifies verbatim against `webapp.py` or is marked as a SPEAKER's
         words by a "literal:" attribution within the 40 characters before it
         (the owner's ratification quotes cite no file, so Freeze 7's substring
         rule cannot reach them);
      2. the two `webapp.py:37-44` quotations are STILL PRESENT and still
         verify -- enumerated by name, so deleting one cannot be how this row
         stays green;
      3. `webapp.py` is the only in-repo file the Changelog cites; a new
         `file.py:LINE` citation fails loudly rather than leaving the probe
         silently narrow;
      4. the `**`-emphasised form is absent from the contract AND from
         webapp.py.

    HONEST LIMIT, UNCHANGED BY THE FLIP AND THE REASON THIS ROW IS NOT A
    STRONGER CLAIM THAN IT MAKES: the contract also cites Brief A and Brief B
    throughout, and Backlogged 2 quotes "137 `style=` occurrences, 134 of them
    outside `webtheme.py`" from Brief A. Those briefs live OUTSIDE this repo,
    so an in-repo check cannot verify them; they are REPORTED here as
    out-of-repo rather than silently passed. CONFORMS on this row therefore
    means "every quotation citing an in-repo file verifies", not "every string
    in this contract has been checked". (For the record, the SEED reconcile
    re-measured Brief A's claim against the tree: 137 total, 134 outside
    `webtheme.py` -- exactly right.)

    WORK ITEM: work_item_pipeline-5r1 was filed at seed for exactly this
    correction and is discharged by this change. It is NOT resolved from this
    branch -- the branch may not write to the live tracker -- so it needs
    closing by hand; the `work` field is dropped here because a CONFORMS row
    carrying a live work ref would read as unfinished business.

- id: OSV1-034
  title: Freeze 8 -- the owner's rendered-page look is not recorded in the Changelog
  contract:
    file: contracts/operator-surface.v1.md
    clause: Freeze 8
    quote: |
      **Freeze 8:** the owner has looked at the rendered L0, L1, and L2 at 430, 900, and 1280px
      in both themes, and that look is recorded in the Changelog as a ratification input, never
      a machine check.
  disposition: GAP
  work: work_item_pipeline-eah
  assertion:
    kind: probe
    ref: test_row_osv1_034
  notes: >
    PINNING ROW -- the probe pins the absence of the record; a passing probe
    here is NOT conformance. Flip direction VIOLATION-MOVEMENT.

    MEASURED 2026-09-04 against 4aaee50: the contract's Changelog has exactly
    two entries, both dated 2026-09-04 (the ENCODE-gate "lgtm." ratification
    and the DRAFT authoring entry). Neither records a look at rendered pages;
    the strings 430, 900 and 1280 appear nowhere in the Changelog.

    THE IRREDUCIBLE HONEST LIMIT, and the reason the clause ends "never a
    machine check": this probe can only ever assert that a RECORD EXISTS. It
    cannot assert that the owner looked. The look is inside the owner attention
    budget (PROTOCOL.md sec.6 item 3, verification only a human or a device can
    perform) and Phase-1 ruling 6 forbids the opposite move -- an agent's look
    reported as a CI pass. Writing this Changelog entry on the owner's behalf,
    or letting a screenshot an agent examined stand in for the look, would be a
    fabricated attestation: it tells the next reader a Freeze gate passed when
    it did not.

    WHY IT IS ROWED AT ALL, given that limit: the record's presence is a byte
    fact that gates the Freeze Bar, and rowing it keeps the condition visible
    between waves instead of surfacing only when someone tries to stamp FROZEN.

- id: OSV1-035
  title: Reserved 1 -- CLI --json shapes, ungoverned until an outside caller parses them
  contract:
    file: contracts/operator-surface.v1.md
    clause: Reserved 1
    quote: |
      **Reserved 1:** `list`/`status`/`instances` `--json` output shapes — namespace held,
      ungoverned.
  disposition: NOT-ASSERTABLE
  justification: >
    Required by the Phase-1 Need-4 ruling, which settled that the CLI's `--json`
    output is NOT a seam today -- the seam test asks "if this changed silently,
    who breaks?" and the answer names no one -- and directed exactly this shape:
    a Reserved namespace with no Core and no Backlogged clause, plus "one
    `OSV1` row, `NOT-ASSERTABLE`, `assertion.kind: none`, with the required
    justification and the review cadence named", so the question stays on a
    cadence instead of being forgotten. NOT-ASSERTABLE is the correct
    disposition on its own merits: the trigger is "the first parse of `--json`
    output by a caller OUTSIDE this repo's own commits", and no probe inside
    this repository can observe an external consumer appearing. What IS
    checkable -- that `--json` exists on `instances`, `status` and `list`
    (cli.py:1772, :1784, :1817, always `indent=2`) -- is not what the clause
    claims. REVIEWED AT CADENCE: at each ENCODE gate, together with the other
    Reserved namespaces; on trigger, `cli-json.v1` is authored as its own
    contract and taken through the Freeze Bar, and does not enter this one.
  assertion:
    kind: none
