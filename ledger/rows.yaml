    justification and the review cadence named", so the question stays on a
    cadence instead of being forgotten. NOT-ASSERTABLE is the correct
    disposition on its own merits: the trigger is "the first parse of `--json`
    output by a caller OUTSIDE this repo's own commits", and no probe inside
    this repository can observe an external consumer appearing. What IS
    checkable -- that `--json` exists on `instances`, `status` and `list`
    (cli.py:1772, :1784, :1817, always `indent=2`) -- is not what the clause
    claims. REVIEWED AT CADENCE: at each ENCODE gate, together with the other
    Reserved namespaces; on trigger, `cli-json.v1` is authored as its own
    contract and taken through the Freeze Bar, and does not enter this one.
  assertion:
    kind: none
