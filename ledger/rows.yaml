- id: CCV1-012
  title: release() confirms the hold actually cleared before reporting success
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 10
    quote: |
      an operation like `release()` must confirm the item status changed before returning
      success.
  disposition: CONFORMS
  work: work_item_pipeline-1f2
  assertion:
    kind: probe
    ref: test_row_ccv1_012
  notes: >
    FIXED. `release` now routes its `bd update --status open --assignee ""`
    through the shared `_verified_write` helper, whose verify demands a
    contention-free read-back showing the item is no longer `held` -- on
    the SUCCESS path as well as the conflict path PR #63 already gave it.
    The pre-write `already_closed` branch is untouched, and the returned
