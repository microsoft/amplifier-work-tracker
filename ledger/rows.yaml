- id: CCV1-018
  title: every custody interaction goes through the work_* tool seam
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 13
    quote: |
      A capability reachable only via raw `bd` CLI or internal API is a missing verb — the
      missing verb is the bug.
  disposition: NOT-ASSERTABLE
  justification: >
    The contract itself declares this clause's machine check NOT-ASSERTABLE.
    What is checkable (this repo's own code routes through the adapter) is
    not what the clause claims (that the SEAM IS COMPLETE, so no actor ever
    needs to go around it). Completeness of a verb surface against unknown
    future needs has no mechanical test; it is established by review when a
    missing verb is discovered, which is how the last three were found (PR
    #8 and PR #11 each cite raw-bd escapes caused by a missing READ verb --
    "14 raw-bd calls across 6 sessions"). Reviewed at cadence: PR audit,
    per-session log audit, skill training. Ratified Call 7 (option A).
  assertion:
    kind: none

- id: CCV1-019
  title: no raw-bd escapes without code review
  contract:
    file: contracts/custody-coordination.v1.md
    clause: NOT-ASSERTABLE 1
    quote: |
      no mechanical check can verify that an agent did not do this; the constraint is enforced
      socially through code review, skill documentation, and process.
  disposition: NOT-ASSERTABLE
  justification: >
    Self-declaring: the clause is about what an AGENT did in a session, not
    about what this repo contains. Nothing in the repository can observe an
    agent shelling out to `bd` in a session it does not host. The mitigation
    is that the seam's own error text is sanitized (`_clean_bd_error`
    substitutes guidance in this tool's vocabulary for raw bd/dolt advice),
    so an agent following its error messages is not LED around the seam --
    that mitigation is itself asserted elsewhere, not here.
  assertion:
    kind: none

