- id: OSV1-015
  title: every adapter listing call reached from a view passes an explicit, finite limit
  contract:
    file: contracts/operator-surface.v1.md
    clause: Core 10
    quote: |
      every adapter call reached from a view passes an explicit limit
  disposition: CONFORMS
  work: work_item_pipeline-8vv
  assertion:
    kind: probe
    ref: test_row_osv1_015
  notes: >
    FLIPPED VIOLATION -> CONFORMS 2026-09-04 (work_item_pipeline-8vv). The pin
    this row carried at SEED asserted the known-wrong shape on purpose; it
    broke the right way when the fix landed, and probe + row were retargeted
    in the SAME change, per the VIOLATION-MOVEMENT rule.

    WHAT WAS WRONG (seed, measured against 4aaee50): webbrowse.py:339, inside
    `project_view` -- the L1 Project Observatory GET handler -- called
    `bd.list(status=status_filter, include_resolved=True, limit=0)`, and
    adapter.py:3958-3963 defines that value without ambiguity: "`limit`, when
    given, behaves like bd's own `--limit`/`-n` (0 means unlimited)". The
    parameter was explicit; its VALUE was unbounded. L1 sits on the 20s
    whole-body self-poll, so every open tab re-materialised the entire item
    set -- resolved included -- three times a minute, then filtered and
    paginated it in Python.

    WHAT IS TRUE NOW (measured 2026-09-04):
      webbrowse.py:91       `_L1_ITEM_QUERY_LIMIT = A.LIST_MAX_LIMIT` (500) --
                            not a number invented for this view: it is the
                            ceiling the CLI's own `list --limit` clamps to,
                            and exactly ten pages of this view's own
                            `LIST_DEFAULT_LIMIT` page size, so paging reaches
                            every row the query returns.
      webbrowse.py:403-409  `bd.list(..., limit=_L1_ITEM_QUERY_LIMIT + 1)`.
                            The `+ 1` is the one-past-the-window probe: it
                            establishes whether more rows exist beyond the
                            ceiling as a FACT, without a second query, so a
                            project holding exactly 500 matching items is
                            never mislabelled as truncated.
      webbrowse.py:227-252  `_truncation_note_html` -- the view says what it
                            is NOT showing. Uncapped: "Showing 50 of 137
                            items". Capped: "Showing 50 of 500+ items - read
                            capped at 500 ...". A bounded window is never
                            rendered as a measured total.

    THE COST THIS BOUND PAYS, recorded rather than buried: the SQL orders by
    `priority ASC, created_at DESC, id ASC` (`adapter._list_rows_via_sql`) and
    the view re-sorts by `updated_at DESC`. On a project with MORE than 500
    matching items the table therefore shows the most-recently-updated of the
    first 500 BY PRIORITY, not of all of them. No project on the shared server
    is near that ceiling today -- `adapter.Beads.list`'s own docstring cites
    the largest, cortex, at 465 items -- and the footer confesses the cap
    whenever it binds. Making it exact would need an offset/count-aware
    listing on the adapter seam, which is out of this row's scope; filed as a
    residual, not silently accepted.

    HOW IT IS ASSERTED: the probe no longer names one call site. It walks
    every GET/HEAD handler in webapp.py/webbrowse.py/webtrust.py, follows
    module-local helpers four deep (the same traversal and the same honest
    bound as the route audit OSV1-007 uses), and requires every reached
    `list`/`list_bounded` call to pass a limit that resolves to a positive
    int. `limit=0` and an omitted `limit` both fail. Product-side, the same
    audit gates a merge in `tests/unit/test_view_query_bounds.py`, which also
    covers the truncation note; both were confirmed to go red against
    `limit=0` and against a removed `limit=` before this row was flipped.

    THE OTHER UNCAPPED CALL, AND WHY IT IS STILL NOT SCORED: webapp.py:909,
    inside `_oldest_ready_item`, calls `bd.list(lane=A.LANE_WORK,
    status="open")` with no `limit` at all -- but the function has ZERO
    callers (the only occurrence of the name in `src/` is its own definition).
    Dead code is not "reached from a view", so the check as written does not
    condemn it. Unchanged from seed, and the probe still re-earns that
    exemption every run by proving the function is still uncalled -- the
    instant it gains a caller, this row goes red.

- id: OSV1-016
  title: the theme choice is persisted in localStorage and applied at first paint
  contract:
    file: contracts/operator-surface.v1.md
    clause: Core 10
    quote: |
      no view holds state that does not survive a refresh
  disposition: CONFORMS
  work: work_item_pipeline-dg3
  assertion:
    kind: probe
    ref: test_row_osv1_016
  notes: >
    FLIPPED VIOLATION -> CONFORMS 2026-09-04 (work_item_pipeline-dg3), probe
    retargeted in the SAME change per the VIOLATION-MOVEMENT rule.

    WHAT WAS WRONG (seed, measured against 4aaee50): webapp.py:3503-3508,
    `wtSetTheme(t)` set `data-theme` on `document.documentElement` and updated
    the toggle's `aria-pressed`. THAT WAS ALL -- no cookie, no localStorage,
    no server round-trip -- while webtheme.py:3423 server-rendered every page
    as `<html lang="en" data-theme="dark">`. So a visitor who chose Light got
    Dark back on the next refresh and on every navigation: state held only in
    page memory, which is this clause's anti-goal in its own words.

    WHAT IS TRUE NOW (measured 2026-09-04):
      webtheme.py:3403      `THEME_STORAGE_KEY = "wt-theme"` -- ONE
                            declaration, so the writer and the first-paint
                            reader cannot drift onto two names (a drift that
                            fails silently and looks exactly like "the toggle
                            does nothing"). webapp substitutes it into its own
                            JS rather than re-spelling it.
      webapp.py:3524-3527   `wtSetTheme` applies AND persists
                            (`localStorage.setItem`, wrapped -- a browser with
                            storage disabled throws, and a theme preference is
                            never worth breaking a page over).
      webtheme.py:3406-3440 `theme_boot_js()` -- the first-paint resolver:
                            stored choice first, else `prefers-color-scheme:
                            light`, else nothing at all.
      webtheme.py:3478      it is inlined in `<head>`, immediately after the
                            two required metas and AHEAD of the stylesheet. A
                            body-end read would apply the stored theme one
                            full paint too late, which is a flash, not a fix.
      webapp.py:3518-3523,  apply and persist are two functions on purpose:
      webapp.py:3540        `wtApplyTheme` never writes, so the sync call at
                            the bottom cannot freeze a first visit's ambient
                            OS preference into a stored "choice" nobody made.
                            That sync call is also what keeps the toggle
                            honest across the 20s body swap: `data-theme`
                            lives on `<html>`, which the swap never touches,
                            but the BUTTONS come back server-rendered with
                            Dark pressed every tick, and the swap re-executes
                            body scripts, so it re-derives `aria-pressed` from
                            the live attribute (verified, not assumed --
                            `auto_refresh_js` replaces
                            `document.body.innerHTML` and re-creates every
                            script in the fresh body).

    PR #55 NOT REGRESSED: the server still renders `data-theme="dark"` as the
    first-paint default (webtheme.py:3472) and the resolver only ever REPLACES
    that attribute, never removes it -- so the DOM-measured defect where a
    light-OS browser silently won the token cascade because `<html>` carried
    no `data-theme` at all cannot return through this path. The probe asserts
    both halves.

