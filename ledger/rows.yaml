- id: OSV1-011
  title: reduced motion is honoured by one kernel-level rule, not per-widget opt-in
  contract:
    file: contracts/operator-surface.v1.md
    clause: Core 7
    quote: |
      `prefers-reduced-motion` is honoured by one kernel-level rule rather than per-widget
      opt-in, so no animation runs under the preference.
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: test_row_osv1_011
  notes: >
    MEASURED 2026-09-04 against 4aaee50. Exactly ONE
    `@media (prefers-reduced-motion:reduce)` block exists in `src/`, at
    webtheme.py:2162, and it is kernel-level -- its selector is
    `*,*::before,*::after`, resetting animation-duration, animation-iteration-count,
    transition-duration and scroll-behavior with `!important`, plus one
    explicit `.dot.on{animation:none;opacity:1}`. There is no second block and
    no per-widget opt-in.

    The rule lives in the BASE `CSS` string, unscoped, so it also governs the
    separately-scoped `OBSERVATORY_CSS` component sheet -- webtheme.py's own
    integration comment records that the base reset and the global
    `:focus-visible` rule "apply to v4 markup unchanged" and are deliberately
    not duplicated. One rule, both stylesheets.

    A second, non-CSS honouring exists at webtheme.py:3882 (a
    `window.matchMedia('(prefers-reduced-motion: reduce)')` check that swaps
    smooth scrolling for auto). That is a JS behaviour, not a per-widget CSS
    opt-in, so it does not contradict the clause.

    RE-DERIVED 2026-09-05 at the second wave-2 integration pass -- still
    CONFORMS, but no longer on the source check alone. The seed's HONEST LIMIT
    read: "this asserts the RULE, never that no animation runs". The browser
    half now answers that question directly, and this row's probe re-reads it:
    all 18 recorded renders (L0/L1/L2 x 430/900/1280 x dark/light) measure
    ZERO animations running under an emulated `prefers-reduced-motion: reduce`
    once the page is quiescent.

    WHAT THE FIRST MERGED-TREE RUN LOOKED LIKE, and why it is NOT a product
    defect -- recorded because the integration brief that reached this row
    said it was, and the measurement says otherwise. `make test-conformance-b`
    on the merged tree failed `test_reduced_motion_stops_every_animation` on
    one to three of the nine dark (level, width) scenarios, differently on
    every run: L0/430 + L1/430 + L1/900, then L0/430 + L1/430 + L0/900, then
    none at all. The kit sampled 120ms after applying the preference; what it
    caught was up to six `CSSTransition`s on `background-color` -- the
    `--duration-fast` 120ms transition (webtheme.py:223) on `a.kpi-card`,
    `a.fleet-row`, `a.agents-now-row`, `a.agent-row` -- created while the page
    LOADED and the theme was applied, i.e. before the preference existed.
    Changing `transition-duration` does not retarget a transition already in
    flight, so those finish at their original duration; the sample was racing
    the exact length of the animation it was measuring. A direct measurement
    settles it: sampling the same pages at 0/120/300/700/1500/3000ms after
    the preference lands, one first sample caught six transitions at
    `currentTime` 116.67 of 120 -- 3ms from the end -- and every sample from
    120ms on reported zero, on every page.

    THE KIT WAS FIXED, NOT THE FLOOR: `_settled_motion` in the Tier-B kit now
    polls until the page is quiescent (3s deadline) and asserts on THAT, and
    records the instant-of-preference-change reading beside it in the artifact
    as `motion_at_preference_change` -- so the transient is visible rather than
    dropped, and a page that never goes quiet still fails, loudly. The probe
    (`MOTION_JS`) also now records each animation's target path, driving
    property and `currentTime`, which is what made the diagnosis above
    possible at all.

    STILL TRUE, and still asserted: exactly one block, universal selector, the
    four properties reset, no `prefers-reduced-motion` query outside
    webtheme.py.

