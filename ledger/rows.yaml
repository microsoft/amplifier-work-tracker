    THIS ROW IS THE EXEMPTION REGISTER. Core 4 says the register lives in
    `ledger/`, not in the contract, "so that shrinking it is a convergent
    change requiring no amendment" -- Phase-1 ruling Need 2 made that binding
    and forbade a ceiling constant in Core. The register is the 23 sites below;
    the probe asserts computed-geometry sites are exactly this set. A DECREASE
    is convergent (shrink the register, let the ledger confirm). An INCREASE --
    a new inline computed site not listed here -- fails the probe loudly.

    CONFORMS is honest and not circular: the claim is "no computed-geometry
