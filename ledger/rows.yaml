    verb surfaces the raw conflict unverified) and
    src/amplifier_work_tracker/cli.py:13-40 (same, operator-facing). The
    correct half of the original guidance -- re-read via a read-only path
    that cannot itself conflict, never resubmit a non-idempotent write
    blind -- survives on both surfaces and is pinned as such.
    work_item_pipeline-ryp.

