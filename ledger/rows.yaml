- id: CCV1-015
  title: only resolve and release verify a conflicted write
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 11
    quote: |
      If a write is reported as failed (exception raised, error returned), the item state must
      not have changed as if the write succeeded.
  disposition: GAP
  work: work_item_pipeline-2x3
  assertion:
    kind: probe
    ref: test_row_ccv1_015
  notes: >
    `_read_back_or_none` has three call sites: resolve, release, and (since
    2026-09-02, item model_performance-f5c) reopen. Every other write verb
    -- take_custody, renew_custody, claim_item, defer/block, supersede,
    update/edit, add_dependency, comment -- still propagates an
    exhausted-retry BeadsError directly, and exhaustion does not prove the
    write did not land. The two that matter most for custody are
    take_custody (a false failure produces exactly the CCV1-003
    held-without-custody state) and renew_custody (a false failure ends
    renewal one-strike and dooms a live hold).
    DRIFT TOWARD SPEC, recorded not absorbed: reopen adopting the discipline
    is real movement, and the count moved 3 -> 4. The row stays GAP because
    neither custody-relevant write is covered.

- id: CCV1-016
  title: awareness.md still asserts a reported conflict means the write did not land
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 11
    quote: |
      a reported conflict error must be accompanied by a readback that confirms the conflict
  disposition: GAP
  work: work_item_pipeline-ryp
  assertion:
    kind: probe
    ref: test_row_ccv1_016
  notes: >
    Doc drift DISCOVERED BY THIS RECONCILE -- it was not on the ratified
    lane-work list, because the prose only became wrong when PR #63
    shipped. context/awareness.md still states as a database guarantee that
    the retryable error family means "the write genuinely did not happen."
