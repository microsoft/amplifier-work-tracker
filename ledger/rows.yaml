# One file rather than the `rows-<seam>.yaml` split LEDGER-FORMAT.md sec.1
# also permits: the tripwires, the probe/row pairing and the mutation harness
# all read ONE parsed list, and splitting would fork that machinery for no
# gain at two families. Each family carries its OWN `<PREFIX>-000` SYNC row,
# first within its family; ids sort so CCV1 precedes OSV1.
