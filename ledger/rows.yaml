    IT RUNS AS ITS OWN TIER: `make test-conformance-b` (depending on
    `make playwright-install`) and a CI step named "Tier 7 -- operator-surface
    conformance (Tier B, browser)", separate from tiers 1-5, installing
    chromium itself and uploading the artifacts. Deliberately NOT part of
    `make test`: `-m "not tier_b"` in pyproject's addopts deselects the tier
    everywhere else, and a command-line `-m tier_b` overrides it.

    DESELECTED, NOT `--ignore`d, on purpose: the module is still imported and
    collected by the fast tiers, so a Tier-B kit that has stopped importing at
    all fails loudly instead of vanishing from the run.
- id: OSV1-029
  title: Freeze 3 -- every Tier-B check emits artifacts, and this ledger re-reads them
  contract:
    file: contracts/operator-surface.v1.md
    clause: Freeze 3
    quote: |
      **Freeze 3:** every Tier-B check emits artifacts the orchestrator re-checks itself; no
      check reports a rendered impression as a pass.
  disposition: CONFORMS
  work: work_item_pipeline-qgo
  assertion:
    kind: probe
    ref: test_row_osv1_029
  notes: >
    RE-DERIVED 2026-09-05, GAP -> CONFORMS, against the closing condition the
    seed itself wrote: "a stable on-disk artifact path with a documented JSON
    shape, and ledger probes here that RE-READ those numbers rather than
    trusting the browser test's own pass/fail." Both halves exist.

    THE KIT'S OWN DISCIPLINE is measure -> write -> read back -> assert. Every
    check computes numbers in the browser, writes them to a JSON record under
    a per-run directory, reads that file back through a reader that REFUSES a
    malformed envelope or an empty measurement, and asserts against what came
    off disk. No assertion in the kit rests on a value that only lived in a
    local variable. Screenshots are saved beside the JSON and NOTHING asserts
    on them -- they are evidence for a human's Freeze 8 look.

    THE LEDGER RE-READS THE NUMBERS ITSELF. The per-run directory is
    gitignored and browserless probes could never read it, so the kit also
    writes a committed run summary at
    `tests/conformance/operator_surface/browser/LAST_RUN.json`: schema
    `operator-surface-tier-b/1`, the browser build the numbers came from, and
    a short headline per check per scenario. OSV1-003, -008, -010, -020, -022,
    -023 and -028 all read their verdicts out of THAT file, in-process and
    sub-second. Until this existed, a green Tier-B tier was a self-report.

    IT IS A RECORDED MEASUREMENT, NOT A LIVE ONE, and is treated as such: the
    summary names the browser build, and this row's probe pins that build
    against `pyproject.toml`'s playwright pin -- so moving the pin fails the
    ledger until the kit is re-run. Re-running rewrites the file; the diff IS
    the new measurement.

    A PARTIAL RUN CANNOT OVERWRITE A FULL ONE: the summary is only written
    when the run produced headlines, so `pytest -k something` cannot replace a
    complete record with a near-empty one that the ledger would read as an
    absence of evidence.
