- id: OSV1-007
  title: no GET handler reaches a mutating adapter call
  contract:
    file: contracts/operator-surface.v1.md
    clause: Core 5
    quote: |
      No `GET` route mutates state.
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: test_row_osv1_007
  notes: >
    MEASURED 2026-09-04 against 4aaee50 by the route audit Core 5's machine
    check names (`reads.never_write`), re-run by the probe on every ledger run:
    every route decorator in webapp.py, webbrowse.py and webtrust.py is parsed
    from the AST, each read-only (GET/HEAD) handler's call graph is walked
    transitively through module-local helpers, and every reached name is
    checked against the adapter's write-verb surface (create, update, comment,
    edit_item, supersede, claim_item, claim_next, release, reopen, resolve,
    defer/undefer, block/unblock, add_dependency, take_custody, renew_custody,
    move_item, remove, rename, delete, erratum).

    RESULT: 30 route registrations (webapp 23, webbrowse 3, webtrust 4), 22
    read-only handlers audited, ZERO reaching a mutating adapter call. The
    mutations are all POST: /login, /setup/tls, /projects, /projects/{n}/items,
    .../items/{id}/update, .../resolve, /projects/{n}/rename,
    /projects/{n}/remove. `GET /projects/{name}/remove` (webapp.py:4900) is the
    typed-name CONFIRM PAGE only; the POST at :4928 does the removal.

    TWO HONEST LIMITS, both narrower than they look:
      1. `GET /auth/logout` (webapp.py:4432) clears a session cookie -- session
         state, not work-tracker state, and it reaches no adapter call. Core 5's
         machine check is scoped to "a mutating adapter call", so this passes as
         written; the clause's broader prose ("it writes only through explicit
         operator actions, which are POST") is the wider claim this check does
         not fully reach.
      2. The audit is static and module-local, bounded at depth 4. A mutation
         reached through a callable passed in from another module would not be
         seen. No such path exists today; a rendered-route check in the Tier-A
         kit would close the residue.

