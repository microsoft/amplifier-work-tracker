    (a real release still succeeds). The conflict half stays covered by
    tests/integration/test_phantom_conflict_recovery.py (CCV1-014).

- id: CCV1-013
  title: both claim paths verify their own write by read-back
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 10
    quote: |
      Every write that changes custody state must read the item back and verify the change
      landed before reporting success.
  disposition: CONFORMS
  work: work_item_pipeline-1gz
  assertion:
    kind: probe
    ref: test_row_ccv1_013
  notes: >
    FIXED. `claim_item` and `claim_next` both route through
    `_verified_write` and both now RETURN the contention-free read-back
    rather than an Item parsed from the writing process's own stdout --
    bd must show this actor holding the item, or the claim raises. The two
    differ only in their conflict-path key: `claim_item` knows the id, so
    it is a plain keyed read; `claim_next` does not (bd chooses, and the
    conflict destroys its stdout), so it uses the id-set difference over
    items assigned to this actor, snapshotted before the write, with
    "more than one new hold" treated as ambiguous and re-raised rather
    than guessed. An empty queue stays a normal `None`, never a failed
    write. Measured 2026-09-02 in tests/integration/test_write_readback.py
    -- six cases covering, for each path, conflict-after-landed (reports
    success), conflict-with-no-write (still raises), and phantom success
    (raises), plus ::test_claim_next_on_an_empty_queue_is_still_a_normal_none.

