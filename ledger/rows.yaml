- id: CCV1-019
  title: no raw-bd escapes without code review
  contract:
    file: contracts/custody-coordination.v1.md
    clause: NOT-ASSERTABLE 1
    quote: |
      no mechanical check can verify that an agent did not do this; the constraint is enforced
      socially through code review, skill documentation, and process.
  disposition: NOT-ASSERTABLE
  justification: >
    Self-declaring: the clause is about what an AGENT did in a session, not
