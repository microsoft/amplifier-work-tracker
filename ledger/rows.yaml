- id: OSV1-016
  title: the theme choice is client-side state that dies on refresh
  contract:
    file: contracts/operator-surface.v1.md
    clause: Core 10
    quote: |
      no view holds state that does not survive a refresh
  disposition: VIOLATION
  work: work_item_pipeline-dg3
  assertion:
    kind: probe
    ref: test_row_osv1_016
  notes: >
    PINNING ROW -- the probe asserts the CURRENT, KNOWN-WRONG shape on purpose;
    a passing probe here is NOT conformance. Flip direction VIOLATION-MOVEMENT.

    MEASURED 2026-09-04 against 4aaee50:
      webapp.py:3503-3508  `wtSetTheme(t)` sets `data-theme` on
                           `document.documentElement` and updates the toggle
                           buttons' `aria-pressed`. THAT IS ALL. No cookie, no
                           localStorage, no server round-trip -- the repo's only
                           four `localStorage` occurrences are the density
                           toggle's (webtheme.py:3866, :3873) and its two
                           docstring mentions.
      webtheme.py:3423     every page is server-rendered
                           `<html lang="en" data-theme="dark">`.
    So a visitor who chooses Light gets Dark back on the next refresh and on
    every navigation. That is client-side state, and it dies -- which is Core
    10's anti-goal in its own words. It is NOT a body-swap defect: the
    attribute sits on `<html>` and the swap replaces `<body>`, so it survives
    the poll and dies on reload.

    THE OPEN READING THIS ROW RETURNED TO THE ROOT AT SEED IS NOW SETTLED, and
    settled the way this row hoped. The seed note read: the density toggle
    persists `wt-density` in `localStorage`, which SATISFIES Core 10's prose
    ("no client-side state that dies on refresh" -- it survives) while being,
    literally, state "stored only in the browser" -- the machine check's words
    as they then stood, and this row's former quote. `density_toggle_html`'s
    own docstring states the consequence: the server "has no way to know a
    visitor's stored preference (no cookie is involved, only `localStorage`)".

    RULING, owner-ratified 2026-09-04 in DRAFT true-up #1 ("yep, do it all."):
    the machine check's wording was ALIGNED TO ITS OWN CLAUSE -- "no view holds
    state that does not survive a refresh (state persisted in `localStorage` or
    on the server survives; state held only in page memory does not)". Quote
    RE-ANCHORED to that new sentence, same clause, same conjunct.

    WHAT THE ALIGNED WORDING DECIDES:
      DENSITY  CONFORMANT. `wt-density` is persisted in `localStorage`
               (webtheme.py:3859 declares the key, :3866 reads it, :3873
               writes it), so the preference survives a refresh. Under the old
               phrasing it was a literal-but-unintended violation; under the
               aligned phrasing it is simply conformant, and the row's probe
               asserts that persistence so a regression re-opens the question
               rather than passing silently.
      THEME    STILL A VIOLATION, unchanged. `wtSetTheme` (webapp.py:3503-3508)
               persists NOTHING -- no cookie, no localStorage, no server
               round-trip -- so a chosen theme is held only in page memory and
               dies on the next load. That is the disposition this row carries,
               and the fact its pin is filed on (work_item_pipeline-dg3).
    The probe was already pinned narrowly on theme, deliberately, so the
    ruling arrived to a row that had not pre-empted it.

