- id: CCV1-001
  title: claim is atomic in both modes; a loser learns it loudly
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 1
    quote: |
      A claim is a single atomic operation with no two-step read-then-claim path. A directed
      claim (claiming a specific item by ID) is not a lesser claim; it atomically establishes
      custody or refuses loudly, naming the blocker: already-held-by-another, not-found, or
      open-dependency-blocking.
  disposition: CONFORMS
  assertion:
    kind: indexed
    last_measured: 2026-09-01
    refs:
      - file: tests/integration/test_directed_claim.py
        name: test_claim_item_succeeds_on_a_free_item
      - file: tests/integration/test_directed_claim.py
        name: test_claim_item_is_idempotent_for_the_same_actor
      - file: tests/integration/test_directed_claim.py
        name: test_claim_next_queue_path_is_unaffected_by_claim_item_existing
  notes: >
    Both claim primitives are single bd invocations -- `bd ready --label
    <lane> --claim` (queue) and `bd update <id> --claim` (directed); no
    read-then-write path exists above the seam, and `--claim` appears
    nowhere else in the production surface. The contract's own Core 1 note
    that these checks are "skipped under --quick in CI" applies to the
    DOCTOR checks (contract.py claim.atomic / claim.directed_atomic), not
