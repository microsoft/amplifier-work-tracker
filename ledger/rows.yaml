- id: OSV1-022
  title: Conformance 3 (body-swap survival) exists and discriminates
  contract:
    file: contracts/operator-surface.v1.md
    clause: Conformance 3
    quote: |
      **Test location:** `tests/conformance/operator_surface/browser/test_tier_b.py` (Core 6).
  disposition: CONFORMS
  work: work_item_pipeline-qgo
  assertion:
    kind: probe
    ref: test_row_osv1_022
  notes: >
    RE-DERIVED 2026-09-05, GAP -> CONFORMS. The fixture exists, runs both
    halves, and discriminates. Core 6's own verdict is OSV1-008 (VIOLATION);
    this row is about the fixture.

    THE SEED'S WARNING WAS RIGHT and shaped the build: "the bad half of this
    fixture is uncomfortably close to the shipped behaviour -- make sure the
    bad half discriminates against something the good half genuinely does
    differently." Measured, the shipped poller differs from a naive
    replacement in exactly ONE of the four named survivals (scroll), so the
    bad halves are built around that.

    BAD HALF 1, the contract's literal wording -- a whole-body `innerHTML`
    replacement with no capture/restore. It loses the open `<details>`, and
    that is what the test asserts.

    BAD HALF 2, and the honest reason it exists: on chromium 148 a SYNCHRONOUS
    `body.innerHTML = html` preserves `window.scrollY` by itself -- the
    document never collapses, so the engine never clamps the offset. The
    contract's literal bad half therefore does NOT discriminate on Core 6's
    scroll half at all. The same whole-body replacement written the other
    common way (clear, force layout, refill) does lose the offset, and that is
    what proves the good half's scroll assertion can see a loss when there is
    one. Both readings are emitted.

    THE VACUOUS-PASS GUARD is part of the fixture, not a nicety. The poller
    swallows every error by design, so a forced tick whose fetch failed leaves
    the page untouched -- and an untouched page "preserves" all four. The kit
    plants a sentinel node before the swap and refuses to measure until it is
    gone. It caught a real instance: chromium marks a non-front page as
    hidden, `document.hidden` is the poller's first guard, and the first
    version of these numbers came from a page nothing had swapped.

    The whole-body `innerHTML` swap this fixture's premise rests on is still
    the shipped mechanism, and this row's probe still pins that.
