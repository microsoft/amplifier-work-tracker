- id: CCV1-011
  title: renewal and takeover are fenced on holder and generation
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 9
    quote: |
      A holder cannot renew custody after the item has been moved to a different holder (via
      reclaim or explicit claim). A zombie holder (a session that held the item, lost custody,
      and later wakes up) cannot re-claim or renew. Generation is monotonically increasing and
      serves as the fence.
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: test_row_ccv1_011
  notes: >
    Three guards pinned: renew fences on holder AND generation, take_custody
    fences on bd's own assignee, and generation always increments past
    whatever was there before (so a zombie's old generation can never match
    again). Behavioral coverage exists in doctor's `custody.fenced` check,
    which is not a pytest test and so cannot be an indexed cite; the
    takeover-while-held shape is additionally covered by
    tests/integration/test_resolve_fence.py::test_resolve_still_refuses_
    with_custody_takeover_mismatch_while_held (measured 2026-09-01).

- id: CCV1-012
  title: release() confirms the hold actually cleared before reporting success
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 10
    quote: |
      an operation like `release()` must confirm the item status changed before returning
      success.
  disposition: CONFORMS
  work: work_item_pipeline-1f2
  assertion:
    kind: probe
    ref: test_row_ccv1_012
  notes: >
    FIXED. `release` now routes its `bd update --status open --assignee ""`
    through the shared `_verified_write` helper, whose verify demands a
    contention-free read-back showing the item is no longer `held` -- on
    the SUCCESS path as well as the conflict path PR #63 already gave it.
    The pre-write `already_closed` branch is untouched, and the returned
    `ReleaseOutcome` is now derived from that same read-back rather than
    asserted from the exit code. This matters because `release` is what
    BOTH work_release AND every reap reclaim call: a `bd update` that
    exited 0 without clearing the hold used to leave the item HELD while
    the sweep reported it reclaimed. Measured 2026-09-02, discriminating
    both ways, in tests/integration/test_write_readback.py::
    test_release_raises_when_bd_reports_success_but_the_hold_did_not_clear
    (phantom success -> raises; the item really is still held) and
    ::test_release_success_path_returns_only_after_the_readback_shows_no_hold
    (a real release still succeeds). The conflict half stays covered by
    tests/integration/test_phantom_conflict_recovery.py (CCV1-014).

- id: CCV1-013
  title: both claim paths verify their own write by read-back
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 10
    quote: |
      Every write that changes custody state must read the item back and verify the change
      landed before reporting success.
  disposition: CONFORMS
  work: work_item_pipeline-1gz
  assertion:
    kind: probe
    ref: test_row_ccv1_013
  notes: >
    FIXED. `claim_item` and `claim_next` both route through
    `_verified_write` and both now RETURN the contention-free read-back
    rather than an Item parsed from the writing process's own stdout --
    bd must show this actor holding the item, or the claim raises. The two
    differ only in their conflict-path key: `claim_item` knows the id, so
    it is a plain keyed read; `claim_next` does not (bd chooses, and the
    conflict destroys its stdout), so it uses the id-set difference over
    items assigned to this actor, snapshotted before the write, with
    "more than one new hold" treated as ambiguous and re-raised rather
    than guessed. An empty queue stays a normal `None`, never a failed
    write. Measured 2026-09-02 in tests/integration/test_write_readback.py
    -- six cases covering, for each path, conflict-after-landed (reports
    success), conflict-with-no-write (still raises), and phantom success
    (raises), plus ::test_claim_next_on_an_empty_queue_is_still_a_normal_none.

- id: CCV1-014
  title: a landed write is never reported as a failure (resolve / release)
