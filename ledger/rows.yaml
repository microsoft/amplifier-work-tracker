- id: OSV1-005
  title: >-
    66 inline style= sites and 40 <style>-block declarations carry a literal
    colour, font, or size
  contract:
    file: contracts/operator-surface.v1.md
    clause: Core 4
    quote: |
      Literal colour, font, or size in an inline `style=` attribute, or in a `<style>` block
      outside the token module (`webtheme.py`'s token block), is a violation; zero are tolerated.
  disposition: VIOLATION
  work: work_item_pipeline-np3
  assertion:
    kind: probe
    ref: test_row_osv1_005
  notes: >
    PINNING ROW -- the probe asserts the CURRENT, KNOWN-WRONG shape on purpose;
    a passing probe here is NOT conformance. Flip direction VIOLATION-MOVEMENT.

    THE CENSUS LIVES HERE, NOT IN THE CONTRACT -- Phase-1 ruling Need 2: "the
    register and the ceiling live in `ledger/`", so shrinking the count is a
    convergent change needing no amendment and no SYNC re-hash. The probe
    RE-RUNS this census every ledger run; the numbers below are its output on
    4aaee50, not a transcription.

    137 inline `style="` sites in `src/amplifier_work_tracker/` (parsed count
    == raw count, asserted by the probe -- a parser that silently loses a site
    would understate the violation):
      LITERAL   66   chartsvg 1, webapp 44, webbrowse 15, webpwa 1, webtrust 3, widgets 2
      COMPUTED  23   chartsvg 3, webapp 13, webtheme 3, widgets 4   -- see OSV1-006
      TOKEN     48   chartsvg 5, webapp 20, webbrowse 15, widgets 8

    CLASSIFICATION RULE, encoded in the probe so the census is reproducible
    rather than asserted: LITERAL = a hex or rgb()/hsl() colour not routed
    through `var(--token)`, OR a font-family/size/weight carrying a literal
    value, OR a length literal (px/rem/em/%) on a size or spacing property.
    COMPUTED = the declaration carries an interpolated `{...}` placeholder.
    TOKEN = only `var(--token)` values and/or properties that are none of
    colour, font or size. The parser splices Python string-literal
    concatenation boundaries first, so an attribute split across adjacent
    literals (webapp.py:1712, webbrowse.py:741) is read as ONE attribute.

    THE 66 LITERAL SITES, enumerated so the migration has no ambiguity:
      chartsvg.py:271
      webapp.py:1677,1703,1712,1715,1742,2264,2267,2288,2293,2295,2297,2299,
        2313,2330,2728,2750,2763,3008,3037,3050,3055,3100,3108,3109,3111,3112,
        3113,3161,3170,3174,3178,3183,3342,3346,3350,3352,3356,3359,3363,4216,
        4396,4909,4912,4918
      webbrowse.py:499,580,645,654,741,747,753,759,763,767,792,798,850,868,869
      webpwa.py:121
      webtrust.py:326,343,382
      widgets.py:1044,1061
    The worst is webpwa.py:121 -- the service worker's offline body carries
    `background:#0D0D0C;color:#F2EEE6;font:16px -apple-system,sans-serif`, the
    RETIRED pre-blend-3 palette, while the live ground token is `#05070f`. The
    webapp.py bulk is overwhelmingly `margin-top:Npx` spacing literals that
    belong on the `--space-*` scale.

    RE-READ 2026-09-04 against the owner-ratified DRAFT true-up #1 ("yep, do
    it all."), which SETTLED the reading this row returned to the root at seed
    and widened Core 4 to reach "a `<style>` block outside the token module
    (`webtheme.py`'s token block)". Quote RE-ANCHORED to the widened sentence
    -- same clause, and the sentence this row was always about. Disposition
    unchanged (VIOLATION); the row now measures TWO halves, pinned separately
    so that fixing one is progress it records rather than a flip it did not
    earn.

    THE `<style>`-BLOCK HALF, measured on this branch by the same probe: ONE
    `<style>` block exists outside the token module -- webtrust.py:256-302
    (the `_CSS` constant, embedded at webtrust.py:374) -- and it carries 40
    literal colour/font/size declarations. Eight of them are the retired
    pre-blend-3 palette this row recorded-but-did-not-score at seed:
      webtrust.py:258  --ground:#0D0D0C  --raise:#151513  --ink:#F2EEE6  --mid:#A6A199
      webtrust.py:259  --quiet:#9C978F   --amber:#D9A253  --rule:#1F1F1D  --rule-hi:#333330
    The other 32 are literal fonts and sizes in the same sheet (Georgia/
    Helvetica Neue font stacks, `font-size:32px`, `padding:52px 24px 80px`,
    and so on). The block deliberately does not import `webtheme.CSS`
    (webtrust.py:249-253 says so in its own comment) -- which is exactly why
