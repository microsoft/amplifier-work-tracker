    non-discriminating here instead of being quietly rewritten.

    A FUTURE AMENDMENT MAY WANT THIS: the contract's `scrollWidth ==
    clientWidth` wording is satisfiable by clipping the overflow rather than
    preventing it. Naming it here rather than proposing a change from a test
    file.

