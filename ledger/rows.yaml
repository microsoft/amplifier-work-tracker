- id: OSV1-018
  title: forms never lead a page -- judgment, named as such by the contract
  contract:
    file: contracts/operator-surface.v1.md
    clause: Core 12
    quote: |
      "leads" is a judgment about what a human reads first, which no static or rendered
      assertion can decide. Named NOT-ASSERTABLE rather than approximated by a proxy.
  disposition: NOT-ASSERTABLE
  justification: >
    The contract declares this clause's machine check NOT-ASSERTABLE in its own
    text, and the declaration is sound rather than a dodge: what is checkable
    (a form's DOM ORDER within a page) is not what the clause claims (what a
    human reads FIRST, which depends on visual weight, scroll position,
    viewport and reading order together). Approximating it with a
    document-order proxy would freeze a number that does not encode the
    promise, which PROTOCOL.md sec.7 resists ("unlabeled judgment where it is
    not [possible]" -- NOT-ASSERTABLE exists so judgment is named, never
    smuggled). REVIEWED AT CADENCE, per the clause: owner review of L0/L1/L2 at
    each ENCODE gate and before any Freeze stamp. Note the cadence is
    discharged by the same owner look Freeze 8 requires (OSV1-034), so the two
    travel together.
  assertion:
    kind: none

