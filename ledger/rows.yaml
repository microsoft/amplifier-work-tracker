      L0 light  0 --alarm, 0 --blocked  across 2 813 440 px  CLEAN
      L1 dark   0 --alarm, 97 --blocked across 3 792 640 px  VIOLATION
      L1 light  0 --alarm, 97 --blocked across 3 792 640 px  VIOLATION
    (L0 swept 2 850 560 px in the tier-b-kit lane's recording, before the hero
