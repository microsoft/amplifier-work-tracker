# Top-level YAML LIST of rows. No wrapper mapping, no `meta:` key -- run
# metadata (repo SHA, tallies, drift narrative) lives in reconcile-report.md,
# never here. Row ids are stable forever: never renumbered, never reused.
#
# Dispositions: CONFORMS | GAP | VIOLATION | OPEN-PINNED | NOT-ASSERTABLE |
# EXCLUDED. (DIVERGED is illegal here -- this team owns both contracts, so
# disagreement is an amendment, not a ledgered divergence.)
#
# Read the probe modules' docstrings before reading a probe
# (`ledger/checks/test_custody_rows.py`, `ledger/checks/test_operator_rows.py`):
# a probe on a red row deliberately pins the CURRENT, KNOWN-WRONG shape, so
# that a silent fix fails as loudly as a regression.

