- id: OSV1-011
  title: reduced motion is honoured by one kernel-level rule, not per-widget opt-in
  contract:
    file: contracts/operator-surface.v1.md
    clause: Core 7
    quote: |
      `prefers-reduced-motion` is honoured by one kernel-level rule rather than per-widget
      opt-in, so no animation runs under the preference.
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: test_row_osv1_011
  notes: >
    MEASURED 2026-09-04 against 4aaee50. Exactly ONE
    `@media (prefers-reduced-motion:reduce)` block exists in `src/`, at
    webtheme.py:2162, and it is kernel-level -- its selector is
    `*,*::before,*::after`, resetting animation-duration, animation-iteration-count,
    transition-duration and scroll-behavior with `!important`, plus one
    explicit `.dot.on{animation:none;opacity:1}`. There is no second block and
    no per-widget opt-in.

    The rule lives in the BASE `CSS` string, unscoped, so it also governs the
    separately-scoped `OBSERVATORY_CSS` component sheet -- webtheme.py's own
    integration comment records that the base reset and the global
    `:focus-visible` rule "apply to v4 markup unchanged" and are deliberately
    not duplicated. One rule, both stylesheets.

    A second, non-CSS honouring exists at webtheme.py:3882 (a
    `window.matchMedia('(prefers-reduced-motion: reduce)')` check that swaps
    smooth scrolling for auto). That is a JS behaviour, not a per-widget CSS
