- id: CCV1-009
  title: a post-reclaim close is not fenced -- the fence is gated on status held
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 7
    quote: |
      A close operation is guarded against a holder that no longer holds the item. This
      includes the released-but-not-yet-re-claimed state (after reclaim has moved the item to
      open status, but custody has not yet been reassigned).
  disposition: VIOLATION
  work: work_item_pipeline-dn4
  assertion:
    kind: probe
    ref: test_row_ccv1_009
  notes: >
    The flagship divergence. `Beads.resolve`'s entire fence block runs only
    under `if current.status == "held":`; a reaped item is `open` with the
    assignee cleared and the custody record still naming the old holder, so
    a stale holder's close skips the fence and lands. adapter.py's own
    docstring names this exact shape as the previously-MEASURED bug the
    fence was built to close -- the status gate added in PR #51 (integrator
    resolve, item pipeline-79t) reinstated it. Neither doctor check covers
    it: `custody.fenced` and `resolve.fenced` both stage a TAKEOVER, so
    status is `held` when the fence is tested. Evidence brief sec.D-2;
    ratified Call 3 (option A). A correct fix must keep BOTH halves: refuse
    the stale holder, and still allow an integrator's single-call resolve
    of an item nobody holds.
    2026-09-02 (item model_performance-f5c): the close path grew a pre-write
    read of its own (the already-resolved rule) and the fence moved from
    `resolve` into `resolve_outcome`, which `resolve` now projects. The
    probe's landmarks were re-pointed to follow it; the CLAIM is unchanged
    and re-verified -- the fence still runs only under `status == "held"`,
    so a post-reclaim close is still unfenced. Disposition stays VIOLATION.

- id: CCV1-010
  title: a session that lost custody can discover it and recover in-process
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 8
    quote: |
      A session that loses custody via reclaim discovers the loss and recovers in-process.
  disposition: CONFORMS
  assertion:
    kind: indexed
    last_measured: 2026-09-01
    refs:
      - file: tests/integration/test_phantom_conflict_recovery.py
        name: test_release_on_an_already_resolved_item_writes_nothing_and_reports_already_closed
  notes: >
    TRUE-UP -- the contract's "PARTIAL" annotation predates PR #63 (merge
    94f0b46). Both halves the clause names now exist: DISCOVERY is passive
    but real (a fenced loss clears self._held at the next renewal tick or
    tool call; a non-fenced loss records lost_reason, surfaced as
    work_status's `holding.custody_lost` and as reminder_snapshot's
    `custody_stale`, which is honestly None -- never fabricated -- when the
    read fails). RECOVERY is the D-6 wedge case, now sanctioned: release()
    checks status BEFORE any write and returns already_closed with NO write
    at all, so the recovery path cannot reopen a closed item. HONEST LIMIT:
    only the adapter half is measured above; the tool-seam half
    (test_phantom_conflict_recovery.py::test_unclaim_recovers_a_session_
    wedged_on_an_already_closed_item, in the modules suite) runs in nothing
    -- CCV1-022. Backlog 3's recovery verb remains Backlogged; the verb
    that closed the incident was existing work_release semantics, not a new
    one.

- id: CCV1-011
  title: renewal and takeover are fenced on holder and generation
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 9
    quote: |
      A holder cannot renew custody after the item has been moved to a different holder (via
      reclaim or explicit claim). A zombie holder (a session that held the item, lost custody,
      and later wakes up) cannot re-claim or renew. Generation is monotonically increasing and
      serves as the fence.
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: test_row_ccv1_011
  notes: >
    Three guards pinned: renew fences on holder AND generation, take_custody
    fences on bd's own assignee, and generation always increments past
    whatever was there before (so a zombie's old generation can never match
    again). Behavioral coverage exists in doctor's `custody.fenced` check,
    which is not a pytest test and so cannot be an indexed cite; the
    takeover-while-held shape is additionally covered by
    tests/integration/test_resolve_fence.py::test_resolve_still_refuses_
    with_custody_takeover_mismatch_while_held (measured 2026-09-01).

- id: CCV1-012
  title: release() reports success off the exit code, with no read-back
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 10
    quote: |
      an operation like `release()` must confirm the item status changed before returning
      success.
  disposition: VIOLATION
  work: work_item_pipeline-1f2
  assertion:
    kind: probe
    ref: test_row_ccv1_012
  notes: >
    NARROWED BY TRUE-UP. PR #63 gave release() a pre-write status check and
    a read-back on the CONFLICT path; the SUCCESS path was untouched and
    still returns straight off `p.returncode == 0`. Every sibling write
    verifies itself (take_custody, renew_custody, resolve, defer/block,
    supersede, add_dependency, CLI unclaim). release does not -- and it is
    what BOTH work_release AND every reap reclaim call, so a `bd update`
    that silently did not land leaves a "reclaimed" item still held while
    the sweep reports it reclaimed. Evidence brief sec.D-4.

