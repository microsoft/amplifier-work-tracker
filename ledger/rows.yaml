- id: CCV1-009
  title: a post-reclaim close is not fenced -- the fence is gated on status held
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 7
    quote: |
      A close operation is guarded against a holder that no longer holds the item. This
      includes the released-but-not-yet-re-claimed state (after reclaim has moved the item to
      open status, but custody has not yet been reassigned).
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: test_row_ccv1_009
  notes: >
    Closed by work_item_pipeline-dn4. The fence is no longer keyed on the
    item's status at all -- it is keyed on custody IDENTITY, so it reaches
    every post-reclaim state including the released-but-not-yet-re-claimed
    one: `Beads.resolve_outcome`'s `elif cust_holder == who and
    current.holder != who` branch, OUTSIDE the `status == "held"` gate,
    refusing with "not held by this session ... Your claim was reclaimed
    (or released) while you were away." PR #51's integrator resolve (item
    pipeline-79t) is preserved by the same key: only the session the
    custody record names is refused, so a plain close of an item nobody
    holds stays a single call for everyone else. The `current.holder !=
    who` guard is what keeps a holder's own already-landed close
    re-attemptable (PR #63's phantom-conflict recovery) -- a resolved item
    retains its assignee. MEASURED 2026-09-02, not merely inspected:
    tests/integration/test_post_reclaim_fence.py is red on the pre-fix code
    (`DID NOT RAISE FencedError` on both fence halves) and green after,
    with test_resolve_fence.py (the integrator half) and
    test_phantom_conflict_recovery.py green throughout. The probe below is
    still an in-process SHAPE assertion -- it additionally verifies that
    fixture exists and still carries both halves, but the behavioural proof
    is the fixture, not the probe (see CCV1-020). Same fix flips the
    previously-red tool-layer fixture
    modules/tool-work-tracker/tests/test_reap_recovery.py::test_explicit_resolve_refusal_after_reap_clears_held_and_allows_new_claim
    green (verified 2026-09-02 in a throwaway venv). STALE-NOTE FIX
    2026-09-03 (mandatory full-ledger re-review, CCV1-000): that sentence
    used to add "that suite still runs in no gate -- CCV1-022", true only
    at the moment this lane's note was written -- CCV1-022 (also wave-1,
    same PR #68) wired the suite into CI in parallel, and the fixture's own
    xfail(strict=True) marker (which had pinned exactly this gap) was
    removed by highway wave 2 (PR #71, ea233a7) once it started XPASSing.
    The suite runs in CI now; see CCV1-022 for the current measured count.
    MERGED 2026-09-02 with `origin/main`'s PR #67 (`reopen` +
    resolve-on-closed fail-loud): the close path grew a pre-write read of
    its own (the already-resolved rule) and the fence moved from `resolve`
    into `resolve_outcome`, which `resolve` now projects -- ONE pre-write
    read now serves both preconditions, identity fence first, then the
    already-resolved rule, both still fully decided before any write. The
    two combine cleanly: a phantom-conflict recovery on a resolve whose
    OWN text already landed (CCV1-014) is unaffected by #67's fail-loud
    rule, because `_resolution_landed` treats identical text as the
    idempotent no-op the retry-safety contract already promised, on both
    the pre-write AND the contended path. The probe's landmarks were
    re-pointed to follow `resolve_outcome`; the CLAIM is unchanged and
    re-verified.

- id: CCV1-010
  title: a session that lost custody can discover it and recover in-process
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 8
    quote: |
      A session that loses custody via reclaim discovers the loss and recovers in-process.
