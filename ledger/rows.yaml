        name: test_release_on_an_already_resolved_item_writes_nothing_and_reports_already_closed
  notes: >
    TRUE-UP -- the contract's "PARTIAL" annotation predates PR #63 (merge
    94f0b46). Both halves the clause names now exist: DISCOVERY is passive
