- id: CCV1-011
  title: renewal and takeover are fenced on holder and generation
  contract:
    file: contracts/custody-coordination.v1.md
    clause: Core 9
    quote: |
      A holder cannot renew custody after the item has been moved to a different holder (via
      reclaim or explicit claim). A zombie holder (a session that held the item, lost custody,
      and later wakes up) cannot re-claim or renew. Generation is monotonically increasing and
      serves as the fence.
  disposition: CONFORMS
  assertion:
    kind: probe
