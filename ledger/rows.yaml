    gap in the OSV1 family -- four Core-clause rows (OSV1-003, -008, -010) plus
    four Conformance rows (OSV1-020..-023) have no other remedy.

    THE THREE SUB-CONDITIONS ARE SEPARABLE, and a partial build satisfies none
    of them: the kit must exist, drive a PINNED chromium (an unpinned browser
    makes a contrast number unreproducible), use ISOLATED fixture data
    (`tests/conftest.py::isolated_dolt_server` -- never the live service), and
    run as its OWN CI tier (a browser tier's cost and flake profile must not
    ride inside the fast tiers).

- id: OSV1-029
  title: Freeze 3 -- no Tier-B artifact exists for the orchestrator to re-check
  contract:
    file: contracts/operator-surface.v1.md
    clause: Freeze 3
    quote: |
      **Freeze 3:** every Tier-B check emits artifacts the orchestrator re-checks itself; no
      check reports a rendered impression as a pass.
  disposition: GAP
  work: work_item_pipeline-qgo
  assertion:
    kind: probe
    ref: test_row_osv1_029
  notes: >
    PINNING ROW -- the probe pins that no Tier-B artifact path exists; a
    passing probe here is NOT conformance. Flip direction VIOLATION-MOVEMENT.

    GAP vacuously today (there are no Tier-B checks, so none of them fails to
    emit), and rowed anyway BECAUSE it is vacuous: this is the condition most
    likely to be quietly skipped once a browser kit does exist and its
    assertions look green. Phase-1 ruling 6 makes it binding -- the run must
    emit computed contrast NUMBERS, pixel-sweep counts, bounding boxes and
    post-swap DOM snapshots the orchestrator re-reads, never a "looks correct"
    verdict (PROTOCOL.md pillar 2: an agent's or monitor's verdict is a raw
    observation).

    WHAT WOULD CLOSE THIS ROW: a stable on-disk artifact path with a documented
    JSON shape, and ledger probes here that RE-READ those numbers rather than
    trusting the browser test's own pass/fail. Until the ledger re-checks them
    itself, a green Tier-B tier is a self-report.

- id: OSV1-030
  title: Freeze 4 -- no Conformance fixture has been demonstrated to discriminate
  contract:
    file: contracts/operator-surface.v1.md
    clause: Freeze 4
    quote: |
      **Freeze 4:** every Conformance fixture discriminates: its bad half fails against the
      defect it names, demonstrated by running it.
  disposition: GAP
  work: work_item_pipeline-qgo
  assertion:
    kind: probe
    ref: test_row_osv1_030
  notes: >
    PINNING ROW -- the probe pins that neither kit file exists, so no fixture
    can have been demonstrated; a passing probe here is NOT conformance. Flip
    direction VIOLATION-MOVEMENT.

    SPANS BOTH KITS: Conformance 1-4 belong to the Tier-B item
    (work_item_pipeline-qgo, this row's `work` ref) and Conformance 5-7 to the
    Tier-A item (work_item_pipeline-c1a). The single-ref schema records the
    first; this note records the second so it is not lost.

    "DEMONSTRATED BY RUNNING IT" IS THE WHOLE CLAUSE. A bad half that has never
    been executed is a claim, and PROTOCOL.md pillar 4 exists because prose
    freezes nothing. The house already has a worked precedent to copy: the
    custody family's CCV1-023 recorded discrimination by REVERTING each fix in
    turn and observing exactly the matching bad half go red while every good
    half stayed green. Do the same here, and record which revert produced which
    failure.

- id: OSV1-031
  title: Freeze 5 -- 10 of the 19 Core-carrying rows read VIOLATION or GAP
  contract:
    file: contracts/operator-surface.v1.md
    clause: Freeze 5
    quote: |
      **Freeze 5:** every Core clause reads CONFORMS in `ledger/`, or is NOT-ASSERTABLE with its
      review cadence named here.
  disposition: GAP
  work: work_item_pipeline-umm
  assertion:
    kind: probe
    ref: test_row_osv1_031
  notes: >
    PINNING ROW, and the only one that reads the LEDGER rather than the repo --
    it asserts that at least one Core-carrying row is still red. A passing
    probe here is NOT conformance; it means the family is still red. Flip
    direction VIOLATION-MOVEMENT: the probe goes red when the last Core row
    turns green, which is the signal to flip this row.

    MEASURED AT SEED, 2026-09-04 against 4aaee50. Core 1-13 are carried by 19
    rows (Core 2, 4, 7, 10 split into halves with differing dispositions):
      CONFORMS 7        OSV1-002, -006, -007, -011, -013, -014, -017
      NOT-ASSERTABLE 2  OSV1-018 (Core 12), OSV1-019 (Core 13) -- both
                        self-declared by the contract WITH the review cadence
                        named in the clause, so both already satisfy this
                        condition's second limb
      VIOLATION 5       OSV1-001, -005, -009, -015, -016
      GAP 5             OSV1-003, -004, -008, -010, -012
    Ten red. Freeze 5 is met when all ten are green and the two NOT-ASSERTABLE
    rows still name their cadence.

    THE FAILURE MODE THIS ROW EXISTS TO CATCH: a GAP row whose only defect is
