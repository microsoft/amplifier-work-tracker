[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-work-tracker"
version = "0.1.0"
description = "Multi-agent work coordination for parallel coding agents, built on Beads (bd)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/microsoft/amplifier-work-tracker"
Repository = "https://github.com/microsoft/amplifier-work-tracker"

[project.scripts]
amplifier-work-tracker = "amplifier_work_tracker.cli:main"

[project.optional-dependencies]
# Test tooling only. Deliberately does NOT list `web` below -- a real
# end-user `uv tool install amplifier-work-tracker` (no extras) stays lean;
# see the `web` group's own comment. Contributors/CI install BOTH
# (`.[dev,web]`, see Makefile/CI) to exercise the web dashboard's tests too.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "httpx>=0.27",  # starlette.testclient.TestClient's transport, web tests only
]
# `amplifier-work-tracker web` -- the dashboard/interaction UI (see
# webapp.py, webauth.py). Optional so the core CLI install (`uv tool
# install amplifier-work-tracker`) never pulls in a web framework a pure
# CLI/agent user doesn't want. Install with `pip install
# amplifier-work-tracker[web]` (or `.[web]` from a checkout).
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",  # required by FastAPI's Form(...) parsing
    "python-pam>=2.0.2",
    "six>=1.16.0",  # undeclared dep of python-pam on some platforms -- see muxplex/pyproject.toml
    "cryptography>=42.0",  # TLS cert generation -- webtls.py's `setup-tls` command
]

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_work_tracker"]

# ---------------------------------------------------------------------------
# pytest -- three independently-selectable tiers.
#
#   tier 1 (unit)        tests/unit/         no marker, no bd, no network
#   tier 2 (integration) tests/integration/  @pytest.mark.integration
#   tier 3 (cli)         tests/cli/          @pytest.mark.cli
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real bd + shared dolt server required (tier 2)",
    "cli: full amplifier-work-tracker CLI-surface tests, requires the real bd binary (tier 3)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "**/__pycache__", "modules"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Point pyright at the project venv explicitly. Without this it analyses with
# its own default environment and cannot resolve dev-only imports such as
# pytest -- which passes locally (where a venv is usually already active) and
# fails in CI. Naming the venv here makes the two environments agree.
venvPath = "."
venv = ".venv"

# modules/ is excluded from the root config above because each module under
# modules/ is its own installable package with its own pyproject.toml (see
# modules/tool-work-tracker/pyproject.toml), and pyright resolves each one
# independently via its own [tool.pyright] extraPaths. Run pyright inside a
# given module directory (or point pyright at it directly) to check it.
