[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-work-tracker"
version = "0.1.0"
description = "Multi-agent work coordination for parallel coding agents, built on Beads (bd)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/microsoft/amplifier-work-tracker"
Repository = "https://github.com/microsoft/amplifier-work-tracker"

[project.scripts]
amplifier-work-tracker = "amplifier_work_tracker.cli:main"

[project.optional-dependencies]
# Test tooling only. Deliberately does NOT list `web` below -- a real
# end-user `uv tool install amplifier-work-tracker` (no extras) stays lean;
# see the `web` group's own comment. Contributors/CI install BOTH
# (`.[dev,web]`, see Makefile/CI) to exercise the web dashboard's tests too.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
    # ledger/checks only -- the conformance ledger (ledger/rows.yaml) is YAML
    # by format, so its own tripwires need a parser. Deliberately NOT a
    # runtime dependency: nothing in src/ imports yaml.
    "pyyaml>=6.0",
    # tests/conformance/operator_surface/browser only -- the Tier-B kit for
    # contracts/operator-surface.v1.md. PINNED TO AN EXACT VERSION on purpose,
    # and that pin is the point: Freeze 2 requires a "pinned chromium", and a
    # playwright release pins exactly one chromium build revision (1.60.0 ->
    # chromium-1234, recorded in every emitted artifact's `browser` block). An
    # unpinned browser makes a computed contrast ratio or a pixel-sweep count
    # unreproducible, which would make every Tier-B number a self-report.
    # Chromium itself is NOT installed by this dependency -- run
    # `make playwright-install`.
    "playwright==1.60.0",
]
# `amplifier-work-tracker web` -- the dashboard/interaction UI (see
# webapp.py, webauth.py). Optional so the core CLI install (`uv tool
# install amplifier-work-tracker`) never pulls in a web framework a pure
# CLI/agent user doesn't want. Install with `pip install
# amplifier-work-tracker[web]` (or `.[web]` from a checkout).
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",  # required by FastAPI's Form(...) parsing
    "python-pam>=2.0.2",
    "six>=1.16.0",  # undeclared dep of python-pam on some platforms -- see muxplex/pyproject.toml
    "cryptography>=42.0",  # TLS cert generation -- webtls.py's `setup-tls` command
    "httpx>=0.27",  # starlette.testclient.TestClient's transport (web tests) AND webpush.py's ntfy alarm delivery (service concern, runtime dep)
]

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_work_tracker"]

# ---------------------------------------------------------------------------
# pytest -- three independently-selectable tiers.
#
#   tier 1 (unit)        tests/unit/         no marker, no bd, no network
#   tier 2 (integration) tests/integration/  @pytest.mark.integration
#   tier 3 (cli)         tests/cli/          @pytest.mark.cli
#
# Plus one OPT-IN tier that a bare `pytest` DESELECTS rather than runs:
#
#   tier B (browser)     tests/conformance/operator_surface/browser/
#                        @pytest.mark.tier_b, selected only by
#                        `make test-conformance-b` / the CI "Tier 7" step.
#
# `-m "not tier_b"` lives in `addopts` below, so every existing invocation
# (`make test`, `make test-unit`, a bare `pytest`) deselects the browser tier
# by default; a command-line `-m tier_b` overrides it, because pytest inserts
# addopts BEFORE the command line and the last `-m` wins. Deselected, never
# `--ignore`d: the module is still imported and collected, so a Tier-B kit
# that has stopped importing at all fails the fast tiers loudly instead of
# vanishing from the run.
#
# Opt-in because it costs a real chromium launch and a real app boot per test,
# and because a browser tier's flake profile must not ride inside the fast
# tiers (contracts/operator-surface.v1.md Freeze 2: "runs as its own CI
# tier"). `--strict-markers` is what makes the marker a real gate rather than
# a typo waiting to silently select nothing.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real bd + shared dolt server required (tier 2)",
    "cli: full amplifier-work-tracker CLI-surface tests, requires the real bd binary (tier 3)",
    "tier_b: real-browser operator-surface conformance, requires chromium (tier B, opt-in)",
]
addopts = "-ra --strict-markers -m 'not tier_b'"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "**/__pycache__", "modules"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Point pyright at the project venv explicitly. Without this it analyses with
# its own default environment and cannot resolve dev-only imports such as
# pytest -- which passes locally (where a venv is usually already active) and
# fails in CI. Naming the venv here makes the two environments agree.
venvPath = "."
venv = ".venv"

# modules/ is excluded from the root config above because each module under
# modules/ is its own installable package with its own pyproject.toml (see
# modules/tool-work-tracker/pyproject.toml), and pyright resolves each one
# independently via its own [tool.pyright] extraPaths. Run pyright inside a
# given module directory (or point pyright at it directly) to check it.
