bundle:
  name: work-tracker-behavior
  version: 0.1.0
  description: >-
    Adds the tool-work-tracker module (atomic claim + PID-bound custody, fenced
    resolve, discovered-work filing), one agent (work-executor), two skills,
    and a thin always-on awareness context covering the silent-failure
    hazards. Does NOT compose `work-tracker:feedback-triage` -- see
    `bundle.md`'s "What's available in this session" for why.

    Engineering floor: work-executor performs arbitrary engineering work,
    so this behavior mounts tool-filesystem + tool-bash as a FLOOR -- a
    bare composition can always progress an item, never claim-then-stall
    silently until reap. A floor is not a ceiling: the composing bundle
    should still supply whatever else its items need (LSP, test runners,
    domain tools, ...).

tools:
  # Relative sources resolve against THIS FILE's directory (behaviors/), not the
  # repo root. "../modules/..." is correct; "./modules/..." silently resolves to
  # behaviors/modules/ and the module never loads.
  - module: tool-work-tracker
    source: ../modules/tool-work-tracker
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=modules/tool-skills
    config:
      skills:
        - "@work-tracker:skills"
  # Engineering floor (fail-loud composition guarantee): without at least
  # filesystem + bash, a host composing this behavior would let work-executor
  # claim an item, take custody, and then silently stall until reap -- the
  # exact failure class this repo's fail-loud posture exists to prevent.
  # Sources match how amplifier-foundation's own bundle.md declares these
  # modules. A floor is not a ceiling; hosts add whatever else items need.
  - module: tool-filesystem
    source: git+https://github.com/microsoft/amplifier-module-tool-filesystem@main
  - module: tool-bash
    source: git+https://github.com/microsoft/amplifier-module-tool-bash@main

hooks:
  # Compact, cadence-gated status reminder for whatever projects this session
  # is subscribed to (see tool-work-tracker's work_subscribe/work_claim
  # auto-subscribe). Reads ONLY the work_tracker.reminder_snapshot capability
  # tool-work-tracker registers above -- no Beads/dolt knowledge of its own.
  - module: hooks-work-subscribe-reminder
    source: ../modules/hooks-work-subscribe-reminder

agents:
  include:
    - work-tracker:work-executor
    # work-tracker:feedback-triage is intentionally NOT composed by default --
    # see this file's description above and bundle.md's "What's available in
    # this session" for why (no tool in this default composition can read
    # lane:intake items, so the agent would have no legal call to make).

context:
  include:
    - work-tracker:context/awareness.md
