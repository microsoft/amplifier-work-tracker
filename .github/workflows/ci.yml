name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Single source of truth for the pinned bd release. Bump this one line to
  # move the floor -- keep it in sync with
  # src/amplifier_work_tracker/adapter.py's MIN_VERSION / MAX_TESTED
  # constants when you do.
  BD_VERSION: "1.1.2"
  DOLT_VERSION: "2.2.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache bd/dolt downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/amplifier-work-tracker-ci-downloads
          key: bd-${{ env.BD_VERSION }}-dolt-${{ env.DOLT_VERSION }}-${{ runner.os }}

      - name: Install dolt (pinned)
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/amplifier-work-tracker-ci-downloads
          cd ~/.cache/amplifier-work-tracker-ci-downloads
          if [ ! -x "./dolt-${DOLT_VERSION}/dolt" ]; then
            curl -fsSL -o dolt.tar.gz \
              "https://github.com/dolthub/dolt/releases/download/v${DOLT_VERSION}/dolt-linux-amd64.tar.gz"
            mkdir -p "dolt-${DOLT_VERSION}"
            tar -xzf dolt.tar.gz -C "dolt-${DOLT_VERSION}" --strip-components=1
          fi
          sudo install -m 0755 "dolt-${DOLT_VERSION}/bin/dolt" /usr/local/bin/dolt
          dolt version

      - name: Install bd (pinned)
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/amplifier-work-tracker-ci-downloads
          cd ~/.cache/amplifier-work-tracker-ci-downloads
          asset="beads_${BD_VERSION}_linux_amd64.tar.gz"
          if [ ! -f "$asset" ]; then
            curl -fsSL -o "$asset" \
              "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/${asset}"
          fi
          mkdir -p "bd-${BD_VERSION}"
          tar -xzf "$asset" -C "bd-${BD_VERSION}"
          sudo install -m 0755 "bd-${BD_VERSION}/bd" /usr/local/bin/bd
          bd --version

      # NOTE: we deliberately do NOT pre-start a dolt server here. The test
      # suite starts its OWN throwaway one, on its own ephemeral port, for
      # the whole session (see tests/_dolt_isolation.py /
      # tests/conftest.py::isolated_dolt_server) -- so `bd`'s conventional
      # :3308 shared-server port is never touched by these runs at all,
      # here or anywhere else. A server started here as a separate step
      # would just be an unused, orphaned process.

      # ONE venv, ONE command -- kept byte-identical in intent to the
      # Makefile's `venv` target. The second editable target is the
      # amplifier tool module under modules/: a separate installable package
      # whose absence made `import amplifier_module_tool_work_tracker` a
      # ModuleNotFoundError here, which is why its suite ran in nothing
      # (ledger row CCV1-022). Its `[dev]` extra carries that suite's
      # test-only deps (amplifier-core, pytest-asyncio).
      - name: Set up amplifier-work-tracker
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -e ".[dev,web]" -e "modules/tool-work-tracker[dev]"

      - name: Lint + format check (ruff)
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .

      - name: Type check (pyright)
        run: .venv/bin/pyright src tests

      - name: Tier 1 -- unit tests
        run: .venv/bin/python -m pytest tests/unit -v

      - name: Tier 2 -- integration tests
        run: .venv/bin/python -m pytest -m integration tests/integration -v

      - name: Tier 3 -- CLI surface tests
        run: .venv/bin/python -m pytest -m cli tests/cli -v

      # Tier 4 -- the conformance ledger for contracts/custody-coordination.v1.md.
      # In-process only (no bd, no dolt, no network), so it needs none of the
      # setup above and runs in well under a second. It is a separate step
      # rather than folded into a tier so a ledger failure is legible at a
      # glance as a CONTRACT-DRIFT failure, not a product-test failure.
      - name: Tier 4 -- conformance ledger
        run: .venv/bin/python -m pytest ledger/checks -v

      # Tier 6 -- contracts/operator-surface.v1.md's Tier-A conformance kit.
      # Freeze 1 requires it to exist AND to run on every pull request, so it
      # is a named step of its own: a kit that runs in no gate is the exact
      # failure ledger row CCV1-022 already recorded once. Runs AFTER the
      # tiers above because its rendered checks need the same real `bd` and
      # dolt those tiers install.
      - name: Tier 6 -- operator-surface conformance (Tier A)
        run: .venv/bin/python -m pytest tests/conformance/operator_surface -v

      # Tier 5 -- the amplifier tool module's own suite
      # (modules/tool-work-tracker/tests). The only place the post-reclaim
      # custody behaviour of the AGENT SEAM (work_claim / work_declare /
      # work_resolve / work_release) is asserted mechanically; before this
      # step existed the suite was importable by nothing and run by nothing
      # (ledger row CCV1-022). A separate pytest invocation on purpose: it
      # brings its own session-scoped isolated dolt server fixture, so
      # folding it into a tier above would stand up two servers in one
      # session. Uses the same pinned `bd` installed above.
      - name: Tier 5 -- tool module tests
        run: .venv/bin/python -m pytest modules/tool-work-tracker/tests -v

      - name: Dolt server log (always, for debugging)
        if: always()
        run: cat /tmp/dolt-server.log || true
